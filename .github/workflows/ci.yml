name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-full-${{ github.ref }}
  # Superseding pushes cancel PR runs only. A cancelled main run can never
  # satisfy the deploy gate for its commit, which left rapid back-to-back
  # merges permanently undeployable.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gatekeeper — tree-sha verdict reuse on main squash pushes (plan S4,
  # [SU] evidence-chain ruling 2026-07-24). A squash merge under strict
  # branch protection reproduces the PR head's git tree byte-for-byte
  # (including this workflow file). When that exact tree already holds a
  # green ci.yml verdict, re-running the suite proves nothing new: every
  # job below skips, the run concludes success, and the deploy gate passes
  # on the exact SHA with this job's summary pointing at the reused run.
  # Every check fails OPEN (reuse=false -> full suite runs).
  #
  # Plan S4(b): the same job classifies docs-only change sets (docs/ plus
  # root-level *.md, excluding docs/hummingbird/ whose generated files are
  # contract-verified by backend-quality). Suite jobs skip on docs_only;
  # the Security job deliberately keeps running on every change set so
  # gitleaks/SAST still scan documentation diffs.
  # ---------------------------------------------------------------------------
  changes:
    name: Changes (verdict-reuse gatekeeper)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.verdict.outputs.reuse }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - name: Classify docs-only change sets
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          not_provable() {
            echo "::notice::Docs-only not provable ($1) — full suite runs."
            exit 0
          }
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '[.[].filename]' | jq -cs 'add')" || not_provable "PR file list failed"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] || not_provable "no push base"
            files_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$GITHUB_SHA" --jq '[.files[].filename]')" || not_provable "compare failed"
            # The compare API truncates at 300 files; a truncated list cannot
            # prove the change set is docs-only.
            [[ "$(jq 'length' <<<"$files_json")" -lt 300 ]] || not_provable "change set too large to classify"
          else
            exit 0
          fi
          if jq -e 'length > 0 and all(test("^docs/|^[^/]+[.]md$")) and (any(test("^docs/hummingbird/")) | not)' <<<"$files_json" >/dev/null; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Docs-only fast path (plan S4b)"
              echo "- Change set: $(jq 'length' <<<"$files_json") file(s), all under \`docs/\` or root-level \`*.md\` (\`docs/hummingbird/\` excluded)"
              echo "- Suite jobs skip; Security (gitleaks / SAST) still runs on every change set."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Docs-only change set — suite jobs skip, security still runs."
          fi

      - name: Look up a green verdict for this exact tree
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Not a main push — full suite runs."
            exit 0
          fi
          fail_open() {
            echo "::notice::Verdict reuse unavailable ($1) — running the full suite."
            exit 0
          }
          commit_json="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA")" || fail_open "commit lookup failed"
          tree_now="$(jq -r '.tree.sha' <<<"$commit_json")"
          subject="$(jq -r '.message' <<<"$commit_json" | head -n 1)"
          # GitHub appends the real PR number last, so a spoofed "(#N)" in a
          # PR title cannot displace it; tree equality below is the actual
          # security property regardless.
          pr_number="$(grep -oE '\(#[0-9]+\)$' <<<"$subject" | tr -dc '0-9')" || true
          [[ -n "${pr_number:-}" ]] || fail_open "no PR number in squash subject"
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.head.sha')" || fail_open "PR #$pr_number lookup failed"
          tree_pr="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$pr_head" --jq '.tree.sha')" || fail_open "PR head commit lookup failed"
          [[ "$tree_now" == "$tree_pr" ]] || fail_open "tree mismatch: squash $tree_now vs PR head $tree_pr"
          run_url="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$pr_head&status=success&per_page=1" --jq '.workflow_runs[0].html_url // empty')" || fail_open "run lookup failed"
          [[ -n "$run_url" ]] || fail_open "no successful ci.yml run exists for PR head $pr_head"
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Verdict reuse (plan S4)"
            echo "- Squash commit: \`$GITHUB_SHA\` (PR #$pr_number)"
            echo "- PR head: \`$pr_head\`"
            echo "- Identical git tree: \`$tree_now\`"
            echo "- Reused green run: $run_url"
            echo ""
            echo "All suite jobs are skipped; the verdict for this exact tree is the linked run ([SU] evidence-chain ruling, 2026-07-24)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Reusing verdict from $run_url"

  # ---------------------------------------------------------------------------
  # Backend — quality/migrations plus deterministic PHPUnit shards
  # ---------------------------------------------------------------------------
  backend-quality:
    name: Backend (Laravel / quality)
    runs-on: ubuntu-latest
    needs: changes
    # Plan S4/S4b: skip on verdict reuse or a provably docs-only change set.
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      HUMMINGBIRD_PATIENT_CONTEXT_KEY: test-hummingbird-patient-context-key-v1
      APP_URL: http://zephyrus.test
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zephyrus_test
      DB_USERNAME: zephyrus
      DB_PASSWORD: secret
      TEST_DB_ISOLATION: "true"
      TEST_DB_ADMIN_DATABASE: postgres
      TEST_NETWORK_GUARD: "true"
      INTEGRATION_SECRET_FILE_ROOT: storage/framework/testing/secrets
      OIDC_ENABLED: "false"
      OIDC_DISCOVERY_URL: https://idp.test/.well-known/openid-configuration
      OIDC_REDIRECT_URI: https://zephyrus.test/auth/oidc/callback
      OIDC_ALLOWED_HOSTS: idp.test
      OIDC_ALLOWED_REDIRECT_URIS: https://zephyrus.test/auth/oidc/callback
      INTEGRATION_ALLOWED_HOSTS: fhir.test
      EPIC_FHIR_BASE_URL: https://fhir.test/r4
      EPIC_SMART_CONFIGURATION_URL: https://fhir.test/.well-known/smart-configuration
      EPIC_FHIR_TOKEN_URL: https://fhir.test/oauth2/token
      EDDY_BASE_URL: http://eddy.test
      ARENA_BASE_URL: http://arena.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/backend-quality

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zephyrus_test
          POSTGRES_USER: zephyrus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zephyrus -d zephyrus_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Hummingbird capability and staff/patient contracts
        run: |
          php scripts/verify-hummingbird-capability-ledger.php
          php scripts/generate-hummingbird-capability-report.php --check
          php scripts/verify-hummingbird-staff-contract.php --self-test-governance
          php scripts/verify-hummingbird-staff-contract.php
          php scripts/verify-hummingbird-patient-disclosure-matrix.php
          php scripts/verify-hummingbird-patient-accessibility-matrix.php
          php scripts/verify-hummingbird-patient-contract.php
          php scripts/verify-hummingbird-contract-baseline.php
          php scripts/verify-hummingbird-transport-security.php
          php scripts/generate-hummingbird-route-inventory.php --check
          bash scripts/check-no-tracking-technologies.sh

      - name: Verify immutable release snapshots
        run: |
          bash tests/Deployment/immutable-release-snapshot.sh
          bash tests/Deployment/deploy-bash32-compat.sh
          bash tests/Deployment/github-ci-gate.sh

      - name: Copy environment template
        run: cp .env.example .env

      - name: Prove test resource isolation
        run: php scripts/assert-test-environment.php

      - name: Verify shard manifest covers every feature test exactly once
        run: bash scripts/ci/verify-shard-manifest.sh

      - name: Run Pint (code style)
        run: ./vendor/bin/pint --test --parallel

      - name: Run migrations
        run: bash scripts/capture-release-evidence.sh backend-migration php artisan migrate --force

      - name: Prove concurrent database isolation
        run: bash scripts/verify-test-isolation.sh --focused

      - name: Upload backend quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-release-evidence
          path: artifacts/release-evidence/backend-quality
          if-no-files-found: error
          retention-days: 30

  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    # Plan S4: skip on verdict reuse (main pushes only — branch protection
    # never gates those runs). The S4b docs-only skip lives on the STEPS, not
    # here: a job-level skip never expands the matrix, so the nine required
    # "Backend tests (…)" contexts would stay "expected" forever and a
    # docs-only PR could never merge. With step-level skips each shard boots,
    # runs nothing, and reports success in ~1 minute.
    if: needs.changes.outputs.reuse != 'true'
    # Ratcheted 30 -> 20 after S1/S2/D1: worst observed shard is ~10.5 m
    # (feature-1 carrying the RadiologyDemoGeneratorTest swing — evidence run
    # 30163345605), so 20 m keeps ~2x headroom while halving hung-shard burn.
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      HUMMINGBIRD_PATIENT_CONTEXT_KEY: test-hummingbird-patient-context-key-v1
      APP_URL: http://zephyrus.test
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zephyrus_test
      DB_USERNAME: zephyrus
      DB_PASSWORD: secret
      TEST_DB_ISOLATION: "true"
      TEST_DB_ADMIN_DATABASE: postgres
      TEST_NETWORK_GUARD: "true"
      INTEGRATION_SECRET_FILE_ROOT: storage/framework/testing/secrets
      OIDC_ENABLED: "false"
      OIDC_DISCOVERY_URL: https://idp.test/.well-known/openid-configuration
      OIDC_REDIRECT_URI: https://zephyrus.test/auth/oidc/callback
      OIDC_ALLOWED_HOSTS: idp.test
      OIDC_ALLOWED_REDIRECT_URIS: https://zephyrus.test/auth/oidc/callback
      INTEGRATION_ALLOWED_HOSTS: fhir.test
      EPIC_FHIR_BASE_URL: https://fhir.test/r4
      EPIC_SMART_CONFIGURATION_URL: https://fhir.test/.well-known/smart-configuration
      EPIC_FHIR_TOKEN_URL: https://fhir.test/oauth2/token
      EDDY_BASE_URL: http://eddy.test
      ARENA_BASE_URL: http://arena.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/backend-${{ matrix.shard }}
    strategy:
      fail-fast: false
      # Plan D3: 4 feature shards, each running 2 paratest workers on
      # per-process isolated databases (was 8 serial shards) — same total
      # test compute on half the VMs, wall ~neutral. Shard scripts run
      # ordered passes to honor the S2 scenario/anchor invariants.
      matrix:
        shard:
          - unit
          - feature-0
          - feature-1
          - feature-2
          - feature-3

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zephyrus_test
          POSTGRES_USER: zephyrus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zephyrus -d zephyrus_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - name: Setup PHP 8.4
        if: needs.changes.outputs.docs_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, zip
          coverage: none

      - name: Cache Composer dependencies
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment template
        if: needs.changes.outputs.docs_only != 'true'
        run: cp .env.example .env

      - name: Prove test resource isolation
        if: needs.changes.outputs.docs_only != 'true'
        run: php scripts/assert-test-environment.php

      - name: Run migrations
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/capture-release-evidence.sh backend-migration php artisan migrate --force

      - name: Run PHPUnit shard
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/capture-release-evidence.sh backend-phpunit-${{ matrix.shard }} scripts/ci/run-backend-test-shard.sh "${{ matrix.shard }}"

      - name: Upload backend shard evidence
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.shard }}-release-evidence
          path: artifacts/release-evidence/backend-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript, Vitest, Vite build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Vitest / Vite)
    runs-on: ubuntu-latest
    needs: changes
    # Plan S4/S4b: skip on verdict reuse or a provably docs-only change set.
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 10
    env:
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: bash scripts/capture-release-evidence.sh frontend-typescript npx tsc --noEmit

      # Coverage output has no PR-lane consumer; the lcov record persists
      # from main pushes only.
      - name: Run Vitest
        run: bash scripts/capture-release-evidence.sh frontend-vitest npx vitest run ${{ github.event_name == 'push' && '--coverage' || '' }}

      - name: Vite production build
        run: bash scripts/capture-release-evidence.sh frontend-build npx vite build

      # Plan S6: browser + DAST download this build and skip their own
      # vite runs — one production build per CI run.
      - name: Upload production build for browser/DAST reuse
        uses: actions/upload-artifact@v4
        with:
          name: vite-production-build
          path: public/build
          if-no-files-found: error
          # Long enough that a failed-job rerun a day or two later can still
          # download it; the durable build record lives in release evidence.
          retention-days: 3

      - name: UI canon check
        run: bash scripts/capture-release-evidence.sh frontend-ui-canon bash scripts/check-ui-canon.sh

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-evidence
          path: artifacts/release-evidence/frontend
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Security — dependency, secret, SAST, and edge-policy release gates
  # ---------------------------------------------------------------------------
  security:
    name: Security (dependencies / secrets / SAST)
    runs-on: ubuntu-latest
    needs: changes
    # Plan S4: skip when an identical tree already holds a green verdict.
    if: needs.changes.outputs.reuse != 'true'
    timeout-minutes: 20
    env:
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/security

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks must inspect the complete repository history.
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned security tools
        run: bash scripts/security/install-tools.sh

      - name: Run security release gates
        run: bash scripts/capture-release-evidence.sh security-suite bash scripts/security/run-security-suite.sh

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-release-evidence
          path: artifacts/release-evidence/security
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Arena sidecar — OCPM pytest incl. the Part X (X4) PM-LLM-Benchmark copilot
  # eval harness (model-discovery quality via conformance-fitness). §X.8.4: a
  # copilot release that regresses model fitness does not ship.
  # ---------------------------------------------------------------------------
  arena:
    name: Arena sidecar (pytest / pm4py)
    runs-on: ubuntu-latest
    needs: changes
    # Plan S4/S4b: skip on verdict reuse or a provably docs-only change set.
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 15
    env:
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/arena

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arena/requirements.txt

      - name: Install dependencies
        working-directory: arena
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run OCPM + copilot eval tests
        run: bash scripts/capture-release-evidence.sh arena-pytest bash -lc 'cd arena && python -m pytest tests -q'

      - name: Upload Arena evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-release-evidence
          path: artifacts/release-evidence/arena
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Browser — real login and protected-route interaction against a test-only DB
  # ---------------------------------------------------------------------------
  browser:
    name: Browser (Playwright / Chromium)
    runs-on: ubuntu-latest
    # frontend is needed for the shared vite build (plan S6); the implicit
    # success() in `if` keeps this job skipped whenever frontend skips.
    needs: [changes, frontend]
    # Plan S4/S4b: skip on verdict reuse or a provably docs-only change set.
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      HUMMINGBIRD_PATIENT_CONTEXT_KEY: test-hummingbird-patient-context-key-v1
      APP_URL: http://127.0.0.1:8084
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zephyrus_test
      DB_USERNAME: zephyrus
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      SESSION_DRIVER: database
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_REGISTRATION_ENABLED: "false"
      DEMO_AUTO_LOGIN_ENABLED: "false"
      TEST_USERNAME: e2e_admin
      TEST_PASSWORD: BrowserOnlyPassword!123
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8084
      PLAYWRIGHT_SKIP_BUILD: "true"
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/browser

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zephyrus_test
          POSTGRES_USER: zephyrus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zephyrus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, zip
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # restore-keys keeps the last browser bundle warm across lockfile
      # changes; playwright install then no-ops unless its version moved.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install application and browser dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare test application
        run: cp .env.example .env

      - name: Download production build from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: vite-production-build
          path: public/build

      - name: Run Playwright
        run: bash scripts/run-browser-suite.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-evidence
          path: |
            artifacts/release-evidence/browser
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # DAST — passive ZAP scan against a disposable Laravel/database boundary
  # ---------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    # frontend is needed for the shared vite build (plan S6); the implicit
    # success() in `if` keeps this job skipped whenever frontend skips.
    needs: [changes, frontend]
    # Plan S4/S4b: skip on verdict reuse or a provably docs-only change set.
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      HUMMINGBIRD_PATIENT_CONTEXT_KEY: test-hummingbird-patient-context-key-v1
      APP_URL: http://127.0.0.1:8085
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zephyrus_test
      DB_USERNAME: zephyrus
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      SESSION_DRIVER: database
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_REGISTRATION_ENABLED: "false"
      DEMO_AUTO_LOGIN_ENABLED: "false"
      TEST_USERNAME: e2e_admin
      TEST_PASSWORD: BrowserOnlyPassword!123
      DAST_SKIP_BUILD: "true"
      RELEASE_EVIDENCE_DIR: artifacts/release-evidence/dast

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zephyrus_test
          POSTGRES_USER: zephyrus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zephyrus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, zip
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install application dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Prepare test application
        run: cp .env.example .env

      - name: Download production build from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: vite-production-build
          path: public/build

      - name: Run pinned ZAP baseline
        run: bash scripts/capture-release-evidence.sh dast-zap bash scripts/run-dast-suite.sh

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-release-evidence
          path: artifacts/release-evidence/dast
          if-no-files-found: error
          retention-days: 30

  mobile-brand-assets:
    name: Mobile product brand assets
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify Hummingbird and Nightingale icon derivations
        run: |
          bash scripts/ci/verify-mobile-brand-assets.sh .
          bash scripts/ci/verify-mobile-brand-surfaces.sh .

  nightingale-contract-foundation:
    name: Nightingale contract foundation
    runs-on: ubuntu-24.04
    needs: changes
    # This remains active for docs-only changes because the contract artifact is
    # intentionally stored under docs/nightingale/api-contract.
    if: needs.changes.outputs.reuse != 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Verify empty contract, held candidates, backend foundation, and native product boundary
        run: |
          node scripts/ci/verify-nightingale-contract-foundation.mjs . --self-test
          node scripts/ci/verify-nightingale-encounter-access-candidate.mjs . --self-test
          node scripts/ci/verify-nightingale-today-candidate.mjs . --self-test
          node scripts/ci/verify-nightingale-identity-source-candidates.mjs . --self-test
          node scripts/ci/verify-nightingale-source-classification.mjs . --self-test
          node scripts/ci/verify-nightingale-communication-notification-classification.mjs . --self-test
          node scripts/ci/verify-nightingale-journey-preference-release-classification.mjs . --self-test
          node scripts/ci/verify-nightingale-threat-hazard-model.mjs . --self-test
          node scripts/ci/verify-nightingale-foundation-dependency-inventory.mjs . --self-test
          php scripts/ci/verify-nightingale-backend-foundation.php . --self-test
          bash scripts/ci/verify-nightingale-product-boundary.sh .

  # ---------------------------------------------------------------------------
  # Nightingale — independent offline native foundation
  # ---------------------------------------------------------------------------
  nightingale-android-foundation:
    name: Nightingale foundation (Android)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nightingale/androidApp

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Verify source, governance, and Gradle product boundaries
        run: |
          bash ../../scripts/ci/verify-nightingale-product-boundary.sh ../..
          node ../../scripts/ci/verify-nightingale-background-assets.mjs ../.. --self-test
          node ../../scripts/ci/verify-nightingale-foundation-dependency-inventory.mjs ../.. --self-test
          ./gradlew --no-daemon --stacktrace verifyNightingaleProductBoundary

      - name: Run Debug and Release unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest testReleaseUnitTest

      - name: Run Debug and Release lint
        run: ./gradlew --no-daemon --stacktrace lintDebug lintRelease

      - name: Assemble Debug and Release apps
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify Nightingale Release APK boundary
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print | sort)
          [[ "${#release_apks[@]}" -eq 1 ]] || {
            echo "Expected exactly one Nightingale Release APK; found ${#release_apks[@]}" >&2
            exit 1
          }
          bash ../../scripts/ci/verify-nightingale-android-release-artifact.sh "${release_apks[0]}"

      - name: Run Debug instrumented tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: nightingale/androidApp
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload Nightingale Android verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightingale-android-foundation-verification
          path: |
            nightingale/androidApp/app/build/reports
            nightingale/androidApp/app/build/test-results
            nightingale/androidApp/app/build/outputs/androidTest-results
            nightingale/androidApp/app/build/outputs/apk/debug/app-debug.apk
            nightingale/androidApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  nightingale-ios-foundation:
    name: Nightingale foundation (iOS)
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 40
    env:
      IOS_NIGHTINGALE_ROOT: nightingale/iosApp

    steps:
      - uses: actions/checkout@v4

      - name: Select and begin booting an available iPhone Simulator
        id: simulator
        run: |
          simulator_udid="$(bash scripts/ci/select-ios-simulator.sh)"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl --fail --show-error --silent --location \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Verify generated Xcode project and source boundary
        run: |
          bash scripts/ci/verify-nightingale-xcode-project.sh "$IOS_NIGHTINGALE_ROOT"
          bash scripts/ci/verify-nightingale-product-boundary.sh .
          xcodebuild -project "$IOS_NIGHTINGALE_ROOT/Nightingale.xcodeproj" -list

      - name: Build signed Debug app for testing
        run: |
          xcodebuild \
            -project "$IOS_NIGHTINGALE_ROOT/Nightingale.xcodeproj" \
            -scheme Nightingale \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/nightingale-ios-tests" \
            build-for-testing

      - name: Wait for simulator boot to complete
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run XCTest unit suite
        run: |
          xcodebuild \
            -project "$IOS_NIGHTINGALE_ROOT/Nightingale.xcodeproj" \
            -scheme Nightingale \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/nightingale-ios-tests" \
            -resultBundlePath "$RUNNER_TEMP/NightingaleUnitTests.xcresult" \
            -only-testing:NightingaleTests \
            -parallel-testing-enabled NO \
            test-without-building

      - name: Run XCUITest reference journeys
        env:
          XCUITEST_RETRY_FLAGS: ${{ github.event_name == 'pull_request' && '-retry-tests-on-failure -test-iterations 3 -test-repetition-relaunch-enabled YES' || '' }}
        run: |
          xcodebuild \
            -project "$IOS_NIGHTINGALE_ROOT/Nightingale.xcodeproj" \
            -scheme Nightingale \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/nightingale-ios-tests" \
            -resultBundlePath "$RUNNER_TEMP/NightingaleUITests.xcresult" \
            -only-testing:NightingaleUITests \
            -parallel-testing-enabled NO \
            $XCUITEST_RETRY_FLAGS \
            test-without-building

      - name: Build unsigned Release app for artifact verification
        run: |
          xcodebuild \
            -project "$IOS_NIGHTINGALE_ROOT/Nightingale.xcodeproj" \
            -scheme Nightingale \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/nightingale-ios-release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Nightingale Release app boundary
        run: |
          release_app="$RUNNER_TEMP/nightingale-ios-release/Build/Products/Release-iphonesimulator/Nightingale.app"
          bash scripts/ci/verify-nightingale-ios-release-artifact.sh "$release_app"

      - name: Shut down test simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true

      - name: Upload Nightingale iOS verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightingale-ios-foundation-verification
          path: |
            ${{ runner.temp }}/NightingaleUnitTests.xcresult
            ${{ runner.temp }}/NightingaleUITests.xcresult
            ${{ runner.temp }}/nightingale-ios-release/Build/Products/Release-iphonesimulator/Nightingale.app
          if-no-files-found: warn
          retention-days: 14

