name: HummingbirdPatient
options:
  bundleIdPrefix: net.acumenus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HummingbirdPatient:
    type: application
    platform: iOS
    sources:
      - HummingbirdPatient
    settings:
      base:
        # Ships to the "Zephyrus-Nightingale" App Store Connect record (app id
        # 6794950746). The target/scheme keep the HummingbirdPatient name — only
        # what Apple sees is branded Nightingale.
        PRODUCT_BUNDLE_IDENTIFIER: net.acumenus.nightingale
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: TKXPY255A2
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HummingbirdPatient/Info.plist
      properties:
        CFBundleDisplayName: Nightingale
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Live patient API. PatientAPIBoundary.validatedBaseURL rejects anything
        # but https://zephyrus.acumenus.net (port nil or 443) in Release, so this
        # value is the only one a shipped build will accept.
        HBPPatientAPIEnabled: true
        HBPPatientAPIBaseURL: "https://zephyrus.acumenus.net"

  HummingbirdPatientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HummingbirdPatientTests
    dependencies:
      - target: HummingbirdPatient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.acumenus.nightingale.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HummingbirdPatient.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HummingbirdPatient"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HummingbirdPatientUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HummingbirdPatientUITests
    dependencies:
      - target: HummingbirdPatient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.acumenus.nightingale.ui-tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  HummingbirdPatient:
    build:
      targets:
        HummingbirdPatient: all
        HummingbirdPatientTests:
          - test
        HummingbirdPatientUITests:
          - test
    test:
      targets:
        - HummingbirdPatientTests
        - HummingbirdPatientUITests
