name: Nightingale
options:
  bundleIdPrefix: net.acumenus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Nightingale:
    type: application
    platform: iOS
    sources:
      - Nightingale
    settings:
      base:
        # Ships to the "Zephyrus-Nightingale" App Store Connect record
        # (app id 6794950746).
        PRODUCT_BUNDLE_IDENTIFIER: net.acumenus.nightingale
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: TKXPY255A2
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Nightingale/Info.plist
      properties:
        CFBundleDisplayName: Nightingale
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # DO NOT bake an endpoint into a shipped build. A distributed Release
        # artifact must stay default-off with an empty base URL:
        # scripts/ci/verify-hummingbird-ios-release-transport.sh asserts
        # HBPPatientAPIEnabled == false AND an empty HBPPatientAPIBaseURL, and
        # fails CI otherwise. Enabling is a runtime concern — PatientAppConfiguration
        # lets HBP_PATIENT_API_ENABLED / HBP_PATIENT_API_BASE_URL from the process
        # environment override these, which is how a dev scheme points at a host.
        HBPPatientAPIEnabled: false
        HBPPatientAPIBaseURL: ""

  NightingaleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NightingaleTests
    dependencies:
      - target: Nightingale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.acumenus.nightingale.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nightingale.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nightingale"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NightingaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NightingaleUITests
    dependencies:
      - target: Nightingale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.acumenus.nightingale.ui-tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Nightingale:
    build:
      targets:
        Nightingale: all
        NightingaleTests:
          - test
        NightingaleUITests:
          - test
    test:
      targets:
        - NightingaleTests
        - NightingaleUITests
